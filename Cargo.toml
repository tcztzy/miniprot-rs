[package]
name = "miniprot"
version = "0.1.0"
edition = "2024"

[lib]
name = "miniprot"
path = "src/lib.rs"

[[bin]]
name = "miniprot"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
niffler = { version = "3.0.0", default-features = false, features = ["gz"] }
noodles = { version = "0.109.0", features = ["core", "fasta", "gff", "gtf", "sam"] }
bytemuck = { version = "1", features = ["derive"] }
metal = "0.31"
objc = "0.2"
pollster = "0.4"
rayon = "1.11.0"
# wgpu: default features auto-select Metal (macOS), Vulkan (Linux), DX12 (Windows).
# spirv + wgsl needed for WGSL compute shader support.
wgpu = { version = "24", features = ["spirv", "wgsl"] }
zerocopy = { version = "0.8.48", features = ["derive"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"

[profile.release.build-override]
opt-level = 3

[dev-dependencies]
assert_cmd = "2.2.0"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
tempfile = "3.27.0"
